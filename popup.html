<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>document.documentElement.dataset.theme=(new URLSearchParams(location.search).get('theme'))||'rock'</script>
<link rel="stylesheet" href="theme.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    background: transparent;
    font-family: "Segoe UI", "Microsoft YaHei", -apple-system, sans-serif;
    -webkit-user-select: none;
  }
  .card {
    margin: 6px;
    background: var(--card);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px 10px;
    color: var(--text);
    font-size: 13px;
    line-height: 1.65;
    box-shadow: var(--shadow);
  }
  .head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 0.5px solid var(--border);
  }
  .term {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .actions { display: flex; gap: 4px; flex-shrink: 0; }
  .btn {
    border: none;
    background: transparent;
    color: var(--text-3);
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
  }
  .btn:hover { background: var(--border-soft); color: var(--text); }
  .btn.vocab { display: none; color: var(--accent); }
  .btn.vocab:hover { background: var(--accent-weak); color: var(--accent-2); }
  .btn.vocab:disabled { color: var(--ok); cursor: default; }
  .btn.vocab:disabled:hover { background: transparent; color: var(--ok); }
  .body {
    min-height: 22px;
    max-height: 300px;
    overflow-y: auto;
    color: var(--text-2);
    -webkit-user-select: text;
    word-break: break-word;
  }
  .body::-webkit-scrollbar { width: 6px; }
  .body::-webkit-scrollbar-track { background: transparent; }
  .body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .body::-webkit-scrollbar-thumb:hover { background: var(--text-4); }
  .body .caret {
    display: inline-block;
    width: 2px;
    height: 14px;
    background: var(--accent);
    vertical-align: -2px;
    margin-left: 1px;
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .placeholder { color: var(--text-3); }
  .err { color: var(--err); }
  /* 额度用完时的就地入口：比让用户自己去翻设置少一步 */
  .fix {
    display: block;
    width: fit-content;
    margin-top: 10px;
    padding: 5px 10px;
    font-size: 11.5px;
    font-family: inherit;
    color: var(--accent);
    background: var(--accent-weak);
    border: 0.5px solid var(--accent-dim);
    border-radius: 6px;
    cursor: pointer;
  }
  .fix:hover { background: var(--hover-strong); color: var(--accent-2); }

  /* ---- 长文本动作选择 ---- */
  .preview {
    display: none;
    position: relative;
    max-height: 50px;
    overflow: hidden;
    color: var(--text-3);
    font-size: 12px;
    line-height: 1.55;
    word-break: break-word;
    -webkit-user-select: text;
  }
  .preview::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 18px;
    background: linear-gradient(transparent, var(--card));
  }
  .opts { display: none; gap: 6px; margin-top: 10px; }
  /* 自定义需求入口：伪装成输入框，点击打开对话窗口（弹窗本身无焦点，不能直接打字） */
  .ask {
    display: none;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    padding: 6px 9px;
    background: var(--card-2);
    border: 0.5px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .ask:hover { border-color: var(--accent-dim); background: var(--hover); }
  .ask .ph { flex: 1; font-size: 12px; color: var(--text-4); }
  .ask:hover .ph { color: var(--text-3); }
  .ask .go { font-size: 11px; color: var(--text-4); }
  .ask:hover .go { color: var(--accent); }
  .opt {
    flex: 1;
    padding: 7px 2px;
    background: var(--card-3);
    border: 0.5px solid var(--border);
    border-radius: 7px;
    color: var(--text-2);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  .opt:hover { background: var(--hover-strong); border-color: var(--accent-dim); color: #fff; }

  .dot.busy { background: var(--accent); }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="head">
      <div class="term" id="term"></div>
      <div class="actions">
        <button class="btn vocab" id="vocabBtn" title="收进英语词库">＋词库</button>
        <button class="btn" id="copyBtn" title="复制结果">复制</button>
        <button class="btn" id="closeBtn" title="关闭">✕</button>
      </div>
    </div>
    <div class="preview" id="preview"></div>
    <div class="opts" id="opts"></div>
    <div class="ask" id="ask">
      <span class="ph">输入你的需求…</span>
      <span class="go">对话 →</span>
    </div>
    <div class="body" id="body"><span class="placeholder">正在生成释义…</span></div>
  </div>
<script>
  const termEl = document.getElementById('term')
  const bodyEl = document.getElementById('body')
  const previewEl = document.getElementById('preview')
  const optsEl = document.getElementById('opts')
  const card = document.getElementById('card')

  let fullText = ''
  let mode = 'loading'
  let labels = {}
  let chooseText = ''
  let isWordSel = false
  let currentTerm = ''

  const askEl = document.getElementById('ask')
  const vocabBtn = document.getElementById('vocabBtn')

  function resetVocabBtn() {
    vocabBtn.style.display = 'none'
    vocabBtn.disabled = false
    vocabBtn.textContent = '＋词库'
  }

  function showVocabBtn() {
    if (!isWordSel) return
    vocabBtn.style.display = 'inline-block'
  }

  function render(text, streaming) {
    bodyEl.innerHTML = ''
    bodyEl.appendChild(document.createTextNode(text))
    if (streaming) {
      const caret = document.createElement('span')
      caret.className = 'caret'
      bodyEl.appendChild(caret)
    }
    reportSize()
  }

  function reportSize() {
    requestAnimationFrame(() => {
      window.ww.resize(Math.ceil(card.getBoundingClientRect().height) + 12)
    })
  }

  function truncate(t, n) {
    return t.length > n ? t.slice(0, n) + '…' : t
  }

  function setTerm(t) {
    termEl.title = t
    termEl.textContent = truncate(t, 40)
  }

  function showResultView() {
    previewEl.style.display = 'none'
    optsEl.style.display = 'none'
    askEl.style.display = 'none'
    bodyEl.style.display = 'block'
  }

  function hideChooser() {
    previewEl.style.display = 'none'
    optsEl.style.display = 'none'
    askEl.style.display = 'none'
    bodyEl.style.display = 'block'
  }

  // ---- 阶段一：长文本动作选择 ----
  window.ww.onChoose((d) => {
    mode = 'choose'
    fullText = ''
    labels = {}
    isWordSel = !!d.isWord
    resetVocabBtn()
    chooseText = d.text || ''
    previewEl.textContent = d.text
    previewEl.style.display = 'block'
    bodyEl.style.display = 'none'
    optsEl.innerHTML = ''
    for (const a of d.actions || []) {
      labels[a.id] = a.label
      const b = document.createElement('button')
      b.className = 'opt'
      b.dataset.action = a.id
      b.textContent = a.label
      b.addEventListener('click', () => {
        if (mode !== 'choose') return
        startLoading(a.id)
        window.ww.choose(a.id)
      })
      optsEl.appendChild(b)
    }
    optsEl.style.display = 'flex'
    askEl.style.display = 'flex'
    setTerm('已选 ' + d.chars + ' 字')
    reportSize()
  })

  function startLoading(action) {
    if (mode !== 'choose') return
    mode = 'loading'
    hideChooser()
    bodyEl.innerHTML = ''
    const ph = document.createElement('span')
    ph.className = 'placeholder'
    ph.textContent = (labels[action] || '生成') + '中…'
    bodyEl.appendChild(ph)
    reportSize()
  }

  // ---- 阶段二：结果 ----
  window.ww.onLoading((d) => {
    mode = 'loading'
    fullText = ''
    isWordSel = !!d.isWord
    currentTerm = d.text || ''
    resetVocabBtn()
    hideChooser()
    const label = d.action && d.action !== 'explain' ? labels[d.action] : ''
    setTerm((label ? label + ' · ' : '') + d.text)
    bodyEl.innerHTML = ''
    const ph = document.createElement('span')
    ph.className = 'placeholder'
    ph.textContent = '正在生成' + (label || '释义') + '…'
    bodyEl.appendChild(ph)
    reportSize()
  })

  window.ww.onResult((d) => {
    mode = 'done'
    fullText = d.result
    isWordSel = !!d.isWord
    currentTerm = d.text || ''
    const label = d.action && d.action !== 'explain' ? labels[d.action] : ''
    setTerm((label ? label + ' · ' : '') + d.text)
    showResultView()
    render(d.result, false)
    showVocabBtn()
    reportSize()
  })

  window.ww.onDelta((chunk) => {
    if (mode === 'done' || mode === 'error' || mode === 'choose') return
    mode = 'stream'
    fullText += chunk
    render(fullText, true)
  })

  window.ww.onDone(() => {
    if (mode === 'error') return
    mode = 'done'
    render(fullText, false)
    showVocabBtn()
    reportSize()
  })

  window.ww.onError((d) => {
    mode = 'error'
    showResultView()
    bodyEl.innerHTML = ''
    const el = document.createElement('span')
    el.className = 'err'
    el.textContent = '生成失败：' + (d.message || '未知错误')
    bodyEl.appendChild(el)
    // 额度用完 / 需要订阅：就地给一个入口，省掉用户自己去翻设置这一步
    const code = d.code || ''
    if (code === 'quota_exhausted' || code === 'plan_required' || code === 'auth_required') {
      const go = document.createElement('button')
      go.className = 'fix'
      go.textContent = code === 'plan_required' ? '升级订阅 →' : '登录 / 兑换额度 →'
      go.addEventListener('click', () => {
        window.ww.openAccount()
        window.ww.close()
      })
      bodyEl.appendChild(go)
    }
    reportSize()
  })

  document.getElementById('closeBtn').addEventListener('click', () => window.ww.close())

  // 收进英语词库
  vocabBtn.addEventListener('click', () => {
    if (vocabBtn.disabled) return
    if (!currentTerm || !fullText) return
    window.ww.addVocab(currentTerm, fullText)
  })

  window.ww.onVocabResult((d) => {
    vocabBtn.textContent = d.added ? '已收录' : '已在库'
    vocabBtn.disabled = true
  })

  // 自定义需求 → 打开独立对话窗口，划词内容作为上下文
  askEl.addEventListener('click', () => {
    if (mode !== 'choose' || !chooseText) return
    window.ww.openChat(chooseText)
    window.ww.close()
  })
  document.getElementById('copyBtn').addEventListener('click', () => {
    if (fullText) window.ww.copy(fullText)
    const b = document.getElementById('copyBtn')
    b.textContent = '已复制'
    setTimeout(() => (b.textContent = '复制'), 1200)
  })

  window.addEventListener('load', reportSize)
  window.ww.onTheme((t) => { document.documentElement.dataset.theme = t })
</script>
</body>
</html>
