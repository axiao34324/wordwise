<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>WordWise 对话</title>
<script>document.documentElement.dataset.theme=(new URLSearchParams(location.search).get('theme'))||'rock'</script>
<link rel="stylesheet" href="theme.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    line-height: 1.6;
    overflow: hidden;
  }
  /* ---- 顶栏 ---- */
  .top {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 0.5px solid var(--border-soft);
    flex-shrink: 0;
  }
  .title { font-size: 13px; font-weight: 600; flex: 1; }
  .tbtn {
    background: transparent;
    border: 0.5px solid var(--border);
    color: var(--text-3);
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
  }
  .tbtn:hover { background: var(--hover); color: var(--text); border-color: var(--text-4); }

  /* ---- 上下文 ---- */
  .ctx {
    flex-shrink: 0;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 0.5px solid var(--border-soft);
    cursor: pointer;
    position: relative;
  }
  .ctx .label {
    font-size: 10px;
    color: var(--text-4);
    letter-spacing: .5px;
    margin-bottom: 3px;
    display: flex;
    justify-content: space-between;
  }
  .ctx .txt {
    font-size: 12px;
    color: var(--text-3);
    max-height: 19px;
    overflow: hidden;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .ctx.open .txt { max-height: 180px; overflow-y: auto; }
  .ctx.open .txt::-webkit-scrollbar { width: 6px; }
  .ctx.open .txt::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ---- 消息区 ---- */
  .msgs {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msgs::-webkit-scrollbar { width: 7px; }
  .msgs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .msgs::-webkit-scrollbar-thumb:hover { background: var(--hover-strong); }

  .msg { max-width: 88%; }
  .msg.user { align-self: flex-end; }
  .msg.ai { align-self: flex-start; }
  .msg .who { font-size: 10px; color: var(--text-4); margin-bottom: 3px; }
  .msg.user .who { text-align: right; }
  .bubble {
    padding: 8px 11px;
    border-radius: 9px;
    white-space: pre-wrap;
    word-break: break-word;
    -webkit-user-select: text;
  }
  .msg.user .bubble { background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 3px; }
  .msg.ai .bubble { background: var(--card-2); border: 0.5px solid var(--border); border-bottom-left-radius: 3px; }
  .msg.ai .bubble.err { color: var(--err); border-color: var(--err-border); }

  /* ---- Markdown ---- */
  .bubble.md { white-space: normal; }
  .bubble p { margin: 0 0 6px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble h1, .bubble h2, .bubble h3 {
    font-size: 13px;
    font-weight: 600;
    margin: 10px 0 5px;
    color: var(--text);
  }
  .bubble h1:first-child, .bubble h2:first-child, .bubble h3:first-child { margin-top: 0; }
  .bubble ul, .bubble ol { margin: 4px 0 6px; padding-left: 20px; }
  .bubble li { margin: 2px 0; }
  .bubble code {
    background: var(--code-bg);
    border: 0.5px solid var(--code-border);
    border-radius: 4px;
    padding: 1px 4px;
    font-family: Consolas, "Cascadia Mono", monospace;
    font-size: 12px;
    color: var(--accent-2);
  }
  .bubble pre {
    background: var(--code-bg);
    border: 0.5px solid var(--code-border);
    border-radius: 7px;
    padding: 9px 11px;
    margin: 6px 0;
    overflow-x: auto;
    white-space: pre;
  }
  .bubble pre code {
    background: transparent;
    border: none;
    padding: 0;
    color: var(--text-2);
    font-size: 12px;
    line-height: 1.55;
  }
  .bubble pre::-webkit-scrollbar { height: 6px; }
  .bubble pre::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .bubble blockquote {
    margin: 6px 0;
    padding: 2px 10px;
    border-left: 2px solid var(--accent-dim);
    color: var(--text-3);
  }
  .bubble hr { border: none; border-top: 0.5px solid var(--border); margin: 8px 0; }
  .bubble a { color: var(--accent); text-decoration: none; border-bottom: 0.5px dotted var(--accent-dim); }
  .bubble strong { color: var(--text); font-weight: 600; }
  .caret {
    display: inline-block;
    width: 2px; height: 13px;
    background: var(--accent);
    vertical-align: -2px;
    margin-left: 1px;
    animation: blink .9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .empty {
    margin: auto;
    text-align: center;
    color: var(--text-4);
    font-size: 12px;
    line-height: 1.9;
  }

  /* ---- 输入区 ---- */
  .inputbar {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    padding: 10px 12px 12px;
    border-top: 0.5px solid var(--border-soft);
    background: var(--bg);
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--card-2);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    line-height: 1.5;
    outline: none;
    max-height: 110px;
    overflow-y: hidden;
  }
  textarea::-webkit-scrollbar { width: 6px; }
  textarea::-webkit-scrollbar-track { background: transparent; }
  textarea::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  textarea::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
  textarea:focus { border-color: var(--accent-strong); }
  textarea::placeholder { color: var(--text-4); }
  .send {
    background: var(--accent-bg);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 15px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    flex-shrink: 0;
  }
  .send:hover { background: var(--accent-strong); }
  .send:disabled { background: var(--border-soft); color: var(--text-4); cursor: default; }

  /* ---- 历史面板 ---- */
  .hist {
    position: absolute;
    inset: 0;
    background: rgba(20,22,27,.97);
    display: none;
    flex-direction: column;
    z-index: 10;
  }
  .hist.show { display: flex; }
  .hist .hh {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 0.5px solid var(--border-soft);
  }
  .hist .hh span { flex: 1; font-weight: 600; }
  .hlist { flex: 1; overflow-y: auto; padding: 8px; }
  .hlist::-webkit-scrollbar { width: 7px; }
  .hlist::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .hitem {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 7px;
    cursor: pointer;
    margin-bottom: 4px;
  }
  .hitem:hover { background: var(--card-2); }
  .hitem.active { background: var(--accent-weak); }
  .hitem .t {
    flex: 1;
    font-size: 12px;
    color: var(--text-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .hitem .m { font-size: 10px; color: var(--text-4); flex-shrink: 0; }
  .hitem .del {
    background: transparent;
    border: none;
    color: var(--text-4);
    cursor: pointer;
    font-size: 13px;
    padding: 0 3px;
    border-radius: 3px;
  }
  .hitem .del:hover { color: var(--err); background: var(--border-soft); }
</style>
</head>
<body>
  <div class="top">
    <div class="title">对话</div>
    <button class="tbtn" id="histBtn">历史</button>
  </div>

  <div class="ctx" id="ctx">
    <div class="label"><span>划词上下文</span><span id="ctxToggle">展开</span></div>
    <div class="txt" id="ctxText"></div>
  </div>

  <div class="msgs" id="msgs"></div>

  <div class="inputbar">
    <textarea id="input" rows="1" placeholder="输入问题，Enter 发送"></textarea>
    <button class="send" id="sendBtn">发送</button>
  </div>

  <div class="hist" id="hist">
    <div class="hh">
      <span>历史会话</span>
      <button class="tbtn" id="histClose">关闭</button>
    </div>
    <div class="hlist" id="hlist"></div>
  </div>

<script>
  const msgsEl = document.getElementById('msgs')
  const inputEl = document.getElementById('input')
  const sendBtn = document.getElementById('sendBtn')
  const ctxEl = document.getElementById('ctx')
  const ctxTextEl = document.getElementById('ctxText')
  const ctxToggle = document.getElementById('ctxToggle')
  const histEl = document.getElementById('hist')
  const hlistEl = document.getElementById('hlist')

  let convId = null
  let conv = null
  let streaming = false
  let currentAi = null
  let aiText = ''

  // ---- 轻量 Markdown 渲染（先转义再解析，避免注入） ----
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  }

  function inline(s) {
    let t = esc(s)
    t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>')
    t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    t = t.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, '<a title="$2">$1</a>')
    return t
  }

  function md(src) {
    const lines = String(src || '').split('\n')
    let out = ''
    let inCode = false
    let codeBuf = []
    let listType = null
    const closeList = () => {
      if (listType) { out += '</' + listType + '>'; listType = null }
    }
    for (const line of lines) {
      if (/^\s*```/.test(line)) {
        if (!inCode) { closeList(); inCode = true; codeBuf = [] }
        else { inCode = false; out += '<pre><code>' + esc(codeBuf.join('\n')) + '</code></pre>' }
        continue
      }
      if (inCode) { codeBuf.push(line); continue }
      if (!line.trim()) { closeList(); continue }
      let m
      if ((m = line.match(/^\s*(#{1,4})\s+(.*)$/))) {
        closeList()
        const lv = Math.min(3, m[1].length)
        out += '<h' + lv + '>' + inline(m[2]) + '</h' + lv + '>'
        continue
      }
      if (/^\s*[-*+]\s+/.test(line)) {
        if (listType !== 'ul') { closeList(); out += '<ul>'; listType = 'ul' }
        out += '<li>' + inline(line.replace(/^\s*[-*+]\s+/, '')) + '</li>'
        continue
      }
      if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
        if (listType !== 'ol') { closeList(); out += '<ol>'; listType = 'ol' }
        out += '<li>' + inline(m[1]) + '</li>'
        continue
      }
      if (/^\s*>\s?/.test(line)) {
        closeList()
        out += '<blockquote>' + inline(line.replace(/^\s*>\s?/, '')) + '</blockquote>'
        continue
      }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { closeList(); out += '<hr>'; continue }
      closeList()
      out += '<p>' + inline(line) + '</p>'
    }
    if (inCode && codeBuf.length) out += '<pre><code>' + esc(codeBuf.join('\n')) + '</code></pre>'
    closeList()
    return out
  }

  function bubble(role, content) {
    const wrap = document.createElement('div')
    wrap.className = 'msg ' + (role === 'user' ? 'user' : 'ai')
    const who = document.createElement('div')
    who.className = 'who'
    who.textContent = role === 'user' ? '你' : 'WordWise'
    const b = document.createElement('div')
    b.className = 'bubble' + (role === 'user' ? '' : ' md')
    if (role === 'user') b.textContent = content
    else b.innerHTML = md(content)
    wrap.appendChild(who)
    wrap.appendChild(b)
    msgsEl.appendChild(wrap)
    scrollBottom()
    return b
  }

  function scrollBottom() {
    msgsEl.scrollTop = msgsEl.scrollHeight
  }

  function renderEmpty() {
    msgsEl.innerHTML = ''
    const d = document.createElement('div')
    d.className = 'empty'
    d.innerHTML = '划选的文字已作为上下文<br>直接输入你的问题即可'
    msgsEl.appendChild(d)
  }

  function renderConv() {
    if (!conv) return
    ctxTextEl.textContent = conv.text || '（无上下文，可自由提问）'
    msgsEl.innerHTML = ''
    if (!conv.messages.length) {
      renderEmpty()
    } else {
      for (const m of conv.messages) bubble(m.role === 'user' ? 'user' : 'ai', m.content)
      scrollBottom()
    }
  }

  async function reload() {
    conv = await window.chatApi.get(convId)
    if (!conv) return
    renderConv()
    inputEl.focus()
  }

  window.chatApi.onLoad(async (id) => {
    convId = id
    await reload()
  })

  // ---- 发送 ----
  async function send() {
    const text = inputEl.value.trim()
    if (!text || streaming || !convId) return
    inputEl.value = ''
    autoGrow()
    const empty = msgsEl.querySelector('.empty')
    if (empty) empty.remove()

    bubble('user', text)
    const b = bubble('ai', '')
    b.appendChild(Object.assign(document.createElement('span'), { className: 'caret' }))
    currentAi = b
    aiText = ''
    streaming = true
    sendBtn.disabled = true
    window.chatApi.send(convId, text)
  }

  window.chatApi.onDelta((d) => {
    if (!currentAi) return
    aiText += d
    currentAi.innerHTML = md(aiText)
    const caret = document.createElement('span')
    caret.className = 'caret'
    currentAi.appendChild(caret)
    scrollBottom()
  })

  window.chatApi.onDone((d) => {
    streaming = false
    sendBtn.disabled = false
    if (currentAi) {
      const final = d.content || aiText
      currentAi.innerHTML = md(final)
      scrollBottom()
    }
    currentAi = null
  })

  window.chatApi.onError((d) => {
    streaming = false
    sendBtn.disabled = false
    if (currentAi) {
      currentAi.classList.add('err')
      currentAi.textContent = '生成失败：' + (d.message || '未知错误')
    }
    currentAi = null
  })

  sendBtn.addEventListener('click', send)
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault()
      send()
    }
  })

  function autoGrow() {
    inputEl.style.height = 'auto'
    const h = Math.min(110, inputEl.scrollHeight)
    inputEl.style.height = h + 'px'
    inputEl.style.overflowY = inputEl.scrollHeight > h ? 'auto' : 'hidden'
  }
  inputEl.addEventListener('input', autoGrow)

  // ---- 上下文展开/收起 ----
  ctxEl.addEventListener('click', () => {
    ctxEl.classList.toggle('open')
    ctxToggle.textContent = ctxEl.classList.contains('open') ? '收起' : '展开'
  })

  // ---- 历史会话 ----
  async function openHistory() {
    const list = await window.chatApi.list()
    hlistEl.innerHTML = ''
    if (!list.length) {
      hlistEl.innerHTML = '<div class="empty">还没有历史会话</div>'
    }
    for (const c of list) {
      const item = document.createElement('div')
      item.className = 'hitem' + (c.id === convId ? ' active' : '')
      const t = document.createElement('div')
      t.className = 't'
      t.textContent = c.text || '（无上下文）'
      const m = document.createElement('div')
      m.className = 'm'
      m.textContent = c.turns ? c.turns + ' 条' : '空'
      const del = document.createElement('button')
      del.className = 'del'
      del.textContent = '✕'
      del.title = '删除该会话'
      del.addEventListener('click', async (e) => {
        e.stopPropagation()
        await window.chatApi.remove(c.id)
        if (c.id === convId) {
          const rest = await window.chatApi.list()
          if (rest.length) { convId = rest[0].id; await reload() }
        }
        openHistory()
      })
      item.appendChild(t)
      item.appendChild(m)
      item.appendChild(del)
      item.addEventListener('click', async () => {
        convId = c.id
        await reload()
        histEl.classList.remove('show')
      })
      hlistEl.appendChild(item)
    }
    histEl.classList.add('show')
  }

  document.getElementById('histBtn').addEventListener('click', openHistory)
  document.getElementById('histClose').addEventListener('click', () => histEl.classList.remove('show'))
  window.chatApi.onShowHistory(() => openHistory())

  window.chatApi.onTheme((t) => { document.documentElement.dataset.theme = t })

  inputEl.focus()
</script>
</body>
</html>
