<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>WordWise 账号</title>
<script>document.documentElement.dataset.theme=(new URLSearchParams(location.search).get('theme'))||'rock'</script>
<link rel="stylesheet" href="theme.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    padding: 22px 24px 26px;
    line-height: 1.6;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 { font-size: 16px; font-weight: 600; letter-spacing: .2px; }
  .sub { font-size: 11.5px; color: var(--text-4); margin-top: 2px; }
  .hidden { display: none !important; }

  /* 登录 / 注册 切换 */
  .tabs { display: flex; gap: 6px; margin: 18px 0 14px; }
  .tabs button {
    flex: 1;
    padding: 8px 0;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-3);
    transition: all .15s;
  }
  .tabs button:hover { color: var(--text-2); border-color: var(--hover-strong); }
  .tabs button.on {
    background: var(--accent-weak);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  label { display: block; font-size: 11.5px; color: var(--text-3); margin: 12px 0 5px; }
  input[type="text"], input[type="password"], input[type="email"] {
    width: 100%;
    background: var(--card-2);
    border: 0.5px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    -webkit-user-select: text;
    user-select: text;
  }
  input:focus { border-color: var(--accent-strong); }

  button.primary {
    width: 100%;
    margin-top: 16px;
    padding: 9px 0;
    background: var(--accent-bg);
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s;
  }
  button.primary:hover { background: var(--accent-strong); }
  button.primary:disabled { opacity: .55; cursor: default; }

  .note {
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--card-2);
    border: 0.5px solid var(--border-soft);
    border-radius: 8px;
    font-size: 11.5px;
    color: var(--text-4);
  }
  .note b { color: var(--text-2); font-weight: 600; }

  .msg { margin-top: 12px; font-size: 12px; min-height: 18px; }
  .msg.err { color: #E4776B; }
  .msg.ok { color: var(--ok); }

  /* 已登录：套餐卡 */
  .card {
    margin-top: 16px;
    padding: 14px 16px;
    background: var(--card);
    border: 0.5px solid var(--border);
    border-radius: 10px;
  }
  .who { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .mail { font-size: 13px; color: var(--text); word-break: break-all; }
  .badge {
    flex-shrink: 0;
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: 20px;
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    background: var(--accent-weak);
  }
  .badge.free { border-color: var(--border); color: var(--text-3); background: var(--card-2); }

  .meter { height: 6px; border-radius: 4px; background: var(--card-3); overflow: hidden; flex: 1; }
  .meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; border-radius: 4px; }
  .meter i.warn { background: #D9863F; }
  .meter i.gone { background: #C05B52; }
  .mline { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-4); margin-top: 6px; }
  .mline b { color: var(--text-2); font-weight: 600; }

  /* 额度两行：今日 / 本月 */
  .quota { margin-top: 14px; display: flex; flex-direction: column; gap: 9px; }
  .qrow { display: flex; align-items: center; gap: 10px; }
  .qrow .qlabel { flex-shrink: 0; width: 28px; font-size: 11px; color: var(--text-4); }
  .qrow .qnum { flex-shrink: 0; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .qrow .qnum b { color: var(--text); font-weight: 600; }

  .kv { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .kv span {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 5px;
    background: var(--card-2);
    border: 0.5px solid var(--border-soft);
    color: var(--text-3);
  }

  h2 { font-size: 13px; font-weight: 600; margin: 20px 0 4px; }
  .hint { font-size: 11.5px; color: var(--text-4); }
  .inline { display: flex; gap: 8px; margin-top: 10px; }
  .inline input { flex: 1; text-transform: uppercase; letter-spacing: .5px; }
  .inline button {
    flex-shrink: 0;
    padding: 0 16px;
    background: var(--card-3);
    border: 0.5px solid var(--border);
    color: var(--text-2);
    border-radius: 6px;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
  }
  .inline button:hover { background: var(--hover-strong); color: var(--text); }
  .inline button:disabled { opacity: .5; cursor: default; }

  .foot { margin-top: 22px; display: flex; align-items: center; justify-content: space-between; }
  .link { font-size: 11.5px; color: var(--text-4); cursor: pointer; text-decoration: underline; }
  .link:hover { color: var(--text-2); }
  .ghost {
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 6px;
    background: transparent;
    border: 0.5px solid var(--border);
    color: var(--text-3);
    font-family: inherit;
    cursor: pointer;
  }
  .ghost:hover { border-color: var(--text-4); color: var(--text); }
</style>
</head>
<body>
  <h1>账号与订阅</h1>
  <div class="sub" id="subline">登录后额度更高，订阅版可用更强的模型</div>

  <!-- 未登录 -->
  <div id="anonView">
    <div class="tabs">
      <button data-mode="login" class="on">登录</button>
      <button data-mode="register">注册</button>
    </div>
    <label>邮箱</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="username">
    <label>密码</label>
    <input type="password" id="password" placeholder="至少 6 位" autocomplete="current-password">
    <button class="primary" id="submitBtn">登录</button>
    <div class="msg" id="msg"></div>
    <div class="note">
      不登录也能用：每天 <b>20 次</b> 试用额度。<br>
      登录后免费版 <b>100 次/天、1500 次/月</b>；订阅版 <b>2000 次/天</b>，并解锁更细的 Pro 模型。
    </div>
  </div>

  <!-- 已登录 -->
  <div id="userView" class="hidden">
    <div class="card">
      <div class="who">
        <div class="mail" id="userMail"></div>
        <div class="badge" id="planBadge">免费版</div>
      </div>
      <div class="quota">
        <div class="qrow">
          <span class="qlabel">今日</span>
          <div class="meter"><i id="meterDay"></i></div>
          <span class="qnum"><b id="dayUsed">0</b> / <span id="dayLimit">0</span></span>
        </div>
        <div class="qrow" id="monthRow">
          <span class="qlabel">本月</span>
          <div class="meter"><i id="meterMonth"></i></div>
          <span class="qnum"><b id="monthUsed">0</b> / <span id="monthLimit">0</span></span>
        </div>
      </div>
      <div class="mline">
        <span id="leftText"></span>
        <span id="rateText"></span>
      </div>
      <div class="kv" id="modelTags"></div>
      <div class="mline" style="margin-top:10px"><span id="expireText"></span></div>
    </div>

    <h2>兑换订阅码</h2>
    <div class="hint">拿到订阅码后填在这里，立即生效</div>
    <div class="inline">
      <input type="text" id="code" placeholder="WW-XXXX-XXXX">
      <button id="redeemBtn">兑换</button>
    </div>
    <div class="msg" id="msg2"></div>

    <div class="foot">
      <span class="link" id="refreshLink">刷新额度</span>
      <button class="ghost" id="logoutBtn">退出登录</button>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id)
  let mode = 'login'
  let busy = false

  function setMsg(el, text, kind) {
    const node = $(el)
    node.textContent = text || ''
    node.className = 'msg' + (kind ? ' ' + kind : '')
  }

  function applyTheme(t) {
    document.documentElement.dataset.theme = t
  }
  window.accountApi.onTheme(applyTheme)

  function render(s) {
    if (!s || !s.loggedIn) {
      $('anonView').classList.remove('hidden')
      $('userView').classList.add('hidden')
      $('subline').textContent = '登录后额度更高，订阅版可用更强的模型'
      return
    }
    $('anonView').classList.add('hidden')
    $('userView').classList.remove('hidden')
    $('subline').textContent = '已登录，划词即可使用'

    $('userMail').textContent = s.email || '(未命名账号)'
    const pro = s.plan === 'pro'
    $('planBadge').textContent = s.planLabel || (pro ? '订阅版' : '免费版')
    $('planBadge').className = 'badge' + (pro ? '' : ' free')

    const limit = s.dailyLimit || 0
    const used = s.used || 0
    const pct = limit > 0 ? Math.min(100, Math.round((used / limit) * 100)) : 0
    const fill = $('meterDay')
    fill.style.width = pct + '%'
    fill.className = pct >= 100 ? 'gone' : pct >= 80 ? 'warn' : ''
    $('dayUsed').textContent = used
    $('dayLimit').textContent = limit

    // 本月额度：匿名用户没有这项，整行隐藏
    const mGoal = s.monthlyLimit || 0
    const mUsed = s.usedMonth || 0
    if (mGoal > 0) {
      $('monthRow').classList.remove('hidden')
      const mp = Math.min(100, Math.round((mUsed / mGoal) * 100))
      const mf = $('meterMonth')
      mf.style.width = mp + '%'
      mf.className = mp >= 100 ? 'gone' : mp >= 80 ? 'warn' : ''
      $('monthUsed').textContent = mUsed
      $('monthLimit').textContent = mGoal
    } else {
      $('monthRow').classList.add('hidden')
    }

    // 哪个先到头就以哪个为准
    const dayLeft = Math.max(0, limit - used)
    const monthLeft = mGoal > 0 ? Math.max(0, mGoal - mUsed) : Infinity
    $('leftText').textContent =
      dayLeft === 0
        ? '今日额度已用完，明日 0 点重置'
        : monthLeft === 0
          ? '本月额度已用完'
          : monthLeft < dayLeft
            ? '本月剩余 ' + monthLeft + ' 次'
            : '今日剩余 ' + dayLeft + ' 次'
    $('rateText').textContent = s.perMinute ? '每分钟 ≤ ' + s.perMinute + ' 次' : ''

    const tags = $('modelTags')
    tags.innerHTML = ''
    const NICE = { 'mimo-v2.6-flash': 'MiMo Flash', 'mimo-v2.6-pro': 'MiMo Pro' }
    for (const m of s.models || []) {
      const el = document.createElement('span')
      el.textContent = NICE[m] || m
      tags.appendChild(el)
    }

    $('expireText').textContent =
      s.expireAt && s.daysLeft !== null
        ? '订阅到期：' + new Date(s.expireAt).toLocaleDateString('zh-CN') + '（还剩 ' + s.daysLeft + ' 天）'
        : pro
          ? ''
          : '免费版长期有效，日额度每日 0 点重置'
  }

  async function boot() {
    const s = await window.accountApi.state()
    render(s)
    if (s && s.loggedIn) {
      const r = await window.accountApi.refresh()
      if (r && r.ok) render({ loggedIn: true, email: s.email, ...r.user })
      else if (r && r.status === 401) render({ loggedIn: false })
    }
  }

  // ---- 登录 / 注册 ----
  for (const b of document.querySelectorAll('.tabs button')) {
    b.addEventListener('click', () => {
      mode = b.dataset.mode
      for (const x of document.querySelectorAll('.tabs button')) x.classList.toggle('on', x === b)
      $('submitBtn').textContent = mode === 'login' ? '登录' : '注册'
      $('password').setAttribute('autocomplete', mode === 'login' ? 'current-password' : 'new-password')
      setMsg('msg', '')
    })
  }

  async function submit() {
    if (busy) return
    const email = $('email').value.trim()
    const password = $('password').value
    if (!email || !email.includes('@')) return setMsg('msg', '请填写正确的邮箱', 'err')
    if (password.length < 6) return setMsg('msg', '密码至少 6 位', 'err')

    busy = true
    $('submitBtn').disabled = true
    setMsg('msg', mode === 'login' ? '正在登录…' : '正在注册…')
    const r = mode === 'login'
      ? await window.accountApi.login(email, password)
      : await window.accountApi.register(email, password)
    busy = false
    $('submitBtn').disabled = false

    if (!r || !r.ok) {
      setMsg('msg', (r && r.error) || '操作失败，请稍后重试', 'err')
      return
    }
    $('password').value = ''
    setMsg('msg', '')
    render({ loggedIn: true, email, ...r.user })
    setMsg('msg2', mode === 'login' ? '登录成功' : '注册成功，已自动登录', 'ok')
  }

  $('submitBtn').addEventListener('click', submit)
  for (const id of ['email', 'password']) {
    $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') submit() })
  }

  // ---- 兑换 ----
  $('redeemBtn').addEventListener('click', async () => {
    const code = $('code').value.trim()
    if (!code) return setMsg('msg2', '请输入订阅码', 'err')
    $('redeemBtn').disabled = true
    setMsg('msg2', '正在兑换…')
    const r = await window.accountApi.redeem(code)
    $('redeemBtn').disabled = false
    if (!r || !r.ok) return setMsg('msg2', (r && r.error) || '兑换失败', 'err')
    $('code').value = ''
    setMsg('msg2', '兑换成功，已升级为' + (r.user && r.user.planLabel ? r.user.planLabel : '订阅版'), 'ok')
    const s = await window.accountApi.state()
    render(s)
  })
  $('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('redeemBtn').click() })

  $('refreshLink').addEventListener('click', async () => {
    setMsg('msg2', '正在刷新…')
    const r = await window.accountApi.refresh()
    if (!r || !r.ok) return setMsg('msg2', (r && r.error) || '刷新失败', 'err')
    setMsg('msg2', '已刷新', 'ok')
    render({ loggedIn: true, email: r.user.email, ...r.user })
  })

  $('logoutBtn').addEventListener('click', async () => {
    await window.accountApi.logout()
    setMsg('msg2', '')
    render({ loggedIn: false })
  })

  boot()
</script>
</body>
</html>
