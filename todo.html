<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>WordWise 待办</title>
<script>document.documentElement.dataset.theme=(new URLSearchParams(location.search).get('theme'))||'rock'</script>
<link rel="stylesheet" href="theme.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    line-height: 1.6;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------- 顶栏 ---------- */
  .top { flex-shrink: 0; padding: 14px 16px 0; }
  .row1 { display: flex; align-items: baseline; gap: 10px; }
  .ttl { font-size: 15px; font-weight: 600; letter-spacing: .2px; }
  .stat { flex: 1; font-size: 11.5px; color: var(--text-4); }
  .stat b { color: var(--text-2); font-weight: 600; }
  .tbtn {
    background: transparent;
    border: 0.5px solid var(--border);
    color: var(--text-3);
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
  }
  .tbtn:hover { background: var(--hover); color: var(--text); border-color: var(--text-4); }
  .tbtn.danger:hover { color: var(--err); border-color: var(--err-border); background: var(--err-bg); }

  .search {
    width: 100%;
    margin-top: 10px;
    background: var(--card-2);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 7px 11px;
    font-size: 12.5px;
    font-family: inherit;
    outline: none;
  }
  .search:focus { border-color: var(--accent-strong); }
  .search::placeholder { color: var(--text-4); }

  /* ---------- 筛选 ---------- */
  .bar { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .tab {
    background: transparent;
    border: none;
    color: var(--text-4);
    font-size: 12px;
    font-family: inherit;
    padding: 4px 2px 6px;
    cursor: pointer;
    border-bottom: 1.5px solid transparent;
    margin-right: 4px;
  }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .tab:hover { color: var(--text-2); }
  .tab .n { color: var(--text-4); font-weight: 400; font-size: 11px; margin-left: 3px; }
  .tab.on .n { color: var(--accent); }
  .spacer { flex: 1; }
  .newList {
    background: transparent;
    border: none;
    color: var(--text-4);
    font-size: 11.5px;
    font-family: inherit;
    cursor: pointer;
    padding: 3px 0;
  }
  .newList:hover { color: var(--accent); }
  .newListBox { display: none; gap: 6px; margin-top: 8px; }
  .newListBox input {
    flex: 1;
    background: var(--card-2);
    border: 0.5px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    padding: 5px 9px;
    font-size: 12px;
    font-family: inherit;
    outline: none;
  }
  .newListBox input:focus { border-color: var(--accent-strong); }

  /* ---------- 列表 ---------- */
  .list { flex: 1; overflow-y: auto; padding: 12px 12px 20px; }
  .list::-webkit-scrollbar { width: 7px; }
  .list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .list::-webkit-scrollbar-thumb:hover { background: var(--hover-strong); }

  .group { margin-bottom: 14px; }
  .ghead {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 2px 4px 6px;
    font-size: 11.5px;
    color: var(--text-4);
  }
  .ghead .gname { font-weight: 600; color: var(--text-3); }
  .ghead .gcount { color: var(--text-4); }
  .ghead .gdel {
    margin-left: auto;
    background: transparent;
    border: none;
    color: var(--text-4);
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    padding: 0 2px;
  }
  .ghead .gdel:hover { color: var(--err); }

  .item {
    background: var(--card);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 7px;
    cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .item:hover { border-color: var(--border); background: var(--card-3); }
  .item.open { border-color: var(--accent-dim); background: var(--card-3); }
  .item.done { opacity: .55; }
  .item.done .it-title { text-decoration: line-through; color: var(--text-3); }

  .ihead { display: flex; align-items: flex-start; gap: 9px; }
  .tick {
    position: relative;
    flex-shrink: 0;
    width: 15px;
    height: 15px;
    margin-top: 3px;
    border: 1.5px solid var(--border);
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    padding: 0;
    transition: border-color .12s, background .12s;
  }
  .tick:hover { border-color: var(--accent); }
  .item.done .tick { border-color: var(--ok); background: var(--ok); }
  /* 打勾：两个边框拼出来的对钩，比塞一个字符更稳 */
  .item.done .tick::after {
    content: '';
    position: absolute;
    left: 4px;
    top: 1px;
    width: 4px;
    height: 7px;
    border: solid var(--bg);
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(43deg);
  }
  .it-main { flex: 1; min-width: 0; }
  .it-title {
    font-size: 13px;
    color: var(--text);
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .item.open .it-title { -webkit-line-clamp: unset; display: block; }
  .it-meta {
    margin-top: 3px;
    font-size: 11px;
    color: var(--text-4);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .it-meta .sep { margin: 0 5px; opacity: .5; }
  .it-meta .app { color: var(--text-3); }
  .hit {
    flex-shrink: 0;
    font-size: 10px;
    color: var(--accent);
    background: var(--accent-weak);
    border: 0.5px solid var(--accent-line);
    border-radius: 10px;
    padding: 0 6px;
    line-height: 1.5;
  }

  /* 展开区 */
  .more { display: none; margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--border-soft); }
  .item.open .more { display: block; }
  .quote {
    padding: 9px 11px;
    background: var(--code-bg);
    border: 0.5px solid var(--code-border);
    border-radius: 7px;
    color: var(--text-2);
    font-size: 12.5px;
    line-height: 1.72;
    max-height: 190px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    -webkit-user-select: text;
    user-select: text;
  }
  .quote::-webkit-scrollbar { width: 6px; }
  .quote::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .field { margin-top: 9px; }
  .flabel { font-size: 11px; color: var(--text-4); margin-bottom: 4px; }
  /* 收藏时顺手存下的释义/结果：回来时常常就是靠它唤起记忆 */
  .defblk {
    padding: 8px 11px;
    background: var(--card-2);
    border-left: 2px solid var(--accent-dim);
    border-radius: 0 7px 7px 0;
    font-size: 12px;
    color: var(--text-3);
    line-height: 1.72;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 150px;
    overflow-y: auto;
    -webkit-user-select: text;
    user-select: text;
  }
  .defblk::-webkit-scrollbar { width: 6px; }
  .defblk::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .note {
    width: 100%;
    min-height: 46px;
    max-height: 120px;
    resize: vertical;
    background: var(--card-2);
    border: 0.5px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    padding: 7px 10px;
    font-size: 12px;
    font-family: inherit;
    line-height: 1.6;
    outline: none;
    -webkit-user-select: text;
    user-select: text;
  }
  .note:focus { border-color: var(--accent-strong); }
  .note::placeholder { color: var(--text-4); }
  .src { font-size: 11.5px; color: var(--text-4); word-break: break-word; -webkit-user-select: text; user-select: text; }
  .src b { color: var(--text-3); font-weight: 400; }

  .acts { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .act {
    background: var(--card-2);
    border: 0.5px solid var(--border);
    color: var(--text-2);
    font-size: 11.5px;
    font-family: inherit;
    padding: 4px 11px;
    border-radius: 6px;
    cursor: pointer;
  }
  .act:hover { background: var(--hover-strong); color: var(--text); }
  .act.pri { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-weak); }
  .act.pri:hover { color: var(--accent-2); }
  .act.quiet { background: transparent; border-color: transparent; color: var(--text-4); }
  .act.quiet:hover { background: var(--border-soft); color: var(--text-2); }
  .act.quiet.del:hover { color: var(--err); }
  .act:disabled { opacity: .5; cursor: default; }
  .listSel {
    background: var(--card-2);
    border: 0.5px solid var(--border);
    color: var(--text-3);
    font-size: 11.5px;
    font-family: inherit;
    padding: 4px 6px;
    border-radius: 6px;
    outline: none;
    cursor: pointer;
  }

  .recap {
    display: none;
    margin-top: 10px;
    padding: 9px 11px;
    background: var(--accent-weak);
    border: 0.5px solid var(--accent-line);
    border-radius: 7px;
    font-size: 12.5px;
    line-height: 1.75;
    color: var(--text-2);
    white-space: pre-wrap;
    word-break: break-word;
    -webkit-user-select: text;
    user-select: text;
  }
  .recap.show { display: block; }
  .recap.err { background: var(--err-bg); border-color: var(--err-border); color: var(--err); }
  .caret {
    display: inline-block;
    width: 2px;
    height: 13px;
    background: var(--accent);
    vertical-align: -2px;
    animation: blink .9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- 空态 / 页脚 ---------- */
  .empty {
    margin: 54px auto 0;
    max-width: 320px;
    text-align: center;
    color: var(--text-4);
    font-size: 12px;
    line-height: 1.95;
  }
  .empty .big { font-size: 13px; color: var(--text-3); margin-bottom: 6px; }
  .empty kbd {
    font-family: inherit;
    font-size: 11.5px;
    color: var(--text-2);
    background: var(--card-3);
    border: 0.5px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .foot {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    border-top: 0.5px solid var(--border-soft);
    font-size: 11px;
    color: var(--text-4);
  }
  .foot .grow { flex: 1; }
  .foot .link {
    background: transparent;
    border: none;
    color: var(--text-4);
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    padding: 0;
  }
  .foot .link:hover { color: var(--text-2); text-decoration: underline; }
  .foot .link.danger:hover { color: var(--err); }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 42px;
    transform: translateX(-50%);
    background: var(--accent-weak);
    border: 0.5px solid var(--accent-line);
    color: var(--accent-2);
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 7px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
    z-index: 10;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="top">
    <div class="row1">
      <span class="ttl">待办</span>
      <span class="stat" id="stat"></span>
      <button class="tbtn" id="exportBtn">导出 Markdown</button>
    </div>
    <input class="search" id="search" type="text" placeholder="搜索标题、原文、备注、来源…">
    <div class="bar">
      <button class="tab on" data-f="open">未完成<span class="n" id="nOpen"></span></button>
      <button class="tab" data-f="done">已完成<span class="n" id="nDone"></span></button>
      <button class="tab" data-f="archived">已归档<span class="n" id="nArch"></span></button>
      <span class="spacer"></span>
      <button class="newList" id="newListBtn">＋新主题</button>
    </div>
    <div class="newListBox" id="newListBox">
      <input type="text" id="newListName" placeholder="主题名，例如：布迪厄 / 这类文章的写法" maxlength="24">
      <button class="tbtn" id="newListOk">创建</button>
    </div>
  </div>

  <div class="list" id="list"></div>

  <div class="foot">
    <span>只存在本机，不上传</span>
    <span class="grow"></span>
    <button class="link" id="purgeBtn">清理已归档</button>
  </div>
  <div class="toast" id="toast"></div>

<script>
  const $ = (id) => document.getElementById(id)
  const listEl = $('list')
  let filter = 'open'
  let query = ''
  let expanded = new Set()
  let lastData = { lists: [], items: [], stats: {} }
  let toastTimer = null
  // 回顾结果存在这里，而不是只留在 DOM 上：展开别的条目会触发整表重绘，
  // 如果不清一次就没了，用户刚点出来的回顾会凭空消失
  const recaps = new Map() // id -> { text, streaming, error }

  function toast(msg) {
    const t = $('toast')
    t.textContent = msg
    t.classList.add('show')
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => t.classList.remove('show'), 1900)
  }

  function fmtDate(ts) {
    if (!ts) return ''
    const d = new Date(ts)
    const now = new Date()
    const same = d.getFullYear() === now.getFullYear()
    const mm = String(d.getMonth() + 1).padStart(2, '0')
    const dd = String(d.getDate()).padStart(2, '0')
    return same ? mm + '-' + dd : d.getFullYear() + '-' + mm + '-' + dd
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag)
    if (cls) n.className = cls
    if (text != null) n.textContent = text
    return n
  }

  async function render() {
    const data = await window.todoApi.list({ filter, q: query })
    lastData = data
    const s = data.stats || {}

    $('nOpen').textContent = s.open ? ' ' + s.open : ''
    $('nDone').textContent = s.done ? ' ' + s.done : ''
    $('nArch').textContent = s.archived ? ' ' + s.archived : ''
    $('stat').innerHTML =
      '<b>' + (s.open || 0) + '</b> 条未完成' +
      (s.today ? ' · 今天新增 ' + s.today : '') +
      (s.done ? ' · 已读完 ' + s.done : '')

    listEl.innerHTML = ''
    const items = data.items || []
    if (!items.length) {
      listEl.appendChild(emptyState())
      return
    }

    // 未完成按主题分组（调研天然是一簇一簇的）；已完成/已归档平铺，用日期找回时间感
    if (filter === 'open' && !query) {
      for (const l of data.lists || []) {
        const mine = items.filter((x) => x.listId === l.id)
        if (!mine.length) continue
        const g = el('div', 'group')
        const h = el('div', 'ghead')
        h.appendChild(el('span', 'gname', l.name))
        h.appendChild(el('span', 'gcount', String(mine.length)))
        if (l.id !== 'inbox') {
          const del = el('button', 'gdel', '删除主题')
          del.title = '删除主题，里面的待办会退回收件箱'
          del.addEventListener('click', async (e) => {
            e.stopPropagation()
            if (!confirm('删除主题「' + l.name + '」？里面的待办会退回收件箱。')) return
            await window.todoApi.removeList(l.id)
            render()
          })
          h.appendChild(del)
        }
        g.appendChild(h)
        for (const it of mine) g.appendChild(card(it, data.lists))
        listEl.appendChild(g)
      }
    } else {
      for (const it of items) listEl.appendChild(card(it, data.lists))
    }
  }

  function emptyState() {
    const d = el('div', 'empty')
    if (query) {
      d.appendChild(el('div', 'big', '没有匹配的待办'))
      d.appendChild(el('div', '', '换个词试试，标题、原文、备注、来源都能搜'))
      return d
    }
    if (filter === 'open') {
      d.appendChild(el('div', 'big', '还没有待办'))
      const p = el('div', '')
      p.innerHTML =
        '在任意程序里划选文字，等弹窗出现后点右上角的 <kbd>＋待办</kbd>。<br>' +
        '不用写任何东西，原文和来源会自动记下来。'
      d.appendChild(p)
    } else if (filter === 'done') {
      d.appendChild(el('div', 'big', '还没有完成的条目'))
      d.appendChild(el('div', '', '读完、查清楚的，点条目左边的小圆圈划掉'))
    } else {
      d.appendChild(el('div', 'big', '没有归档的条目'))
      d.appendChild(el('div', '', '不感兴趣的用「归档」收起来，不会删掉'))
    }
    return d
  }

  function card(it, lists) {
    const box = el('div', 'item' + (it.state === 'done' ? ' done' : '') + (expanded.has(it.id) ? ' open' : ''))

    const head = el('div', 'ihead')
    const tick = el('button', 'tick')
    tick.title = it.state === 'done' ? '标记为未完成' : '标记为已完成'
    tick.addEventListener('click', async (e) => {
      e.stopPropagation()
      await window.todoApi.update(it.id, { state: it.state === 'done' ? 'open' : 'done' })
      render()
    })
    head.appendChild(tick)

    const main = el('div', 'it-main')
    main.appendChild(el('div', 'it-title', it.title))

    const meta = el('div', 'it-meta')
    if (it.source && it.source.app) meta.appendChild(el('span', 'app', prettyApp(it.source.app)))
    if (it.source && it.source.title) {
      if (meta.childNodes.length) meta.appendChild(el('span', 'sep', '·'))
      meta.appendChild(el('span', '', it.source.title))
    }
    if (meta.childNodes.length) meta.appendChild(el('span', 'sep', '·'))
    meta.appendChild(el('span', '', fmtDate(it.createdAt)))
    meta.title = [it.source && it.source.app ? prettyApp(it.source.app) : '', (it.source && it.source.title) || '']
      .filter(Boolean)
      .join(' · ')
    main.appendChild(meta)
    head.appendChild(main)

    if (it.hit > 1) head.appendChild(el('span', 'hit', '×' + it.hit))
    box.appendChild(head)

    // ---- 展开区 ----
    const more = el('div', 'more')

    const quote = el('div', 'quote', it.text)
    more.appendChild(quote)

    // 收藏的时候顺手存下的释义/结果。没有就别占位置
    if (it.def) {
      const df = el('div', 'field')
      df.appendChild(el('div', 'flabel', '当时生成的内容'))
      df.appendChild(el('div', 'defblk', it.def))
      more.appendChild(df)
    }

    const nf = el('div', 'field')
    nf.appendChild(el('div', 'flabel', '备注（为什么留它、回来要做什么）'))
    const note = el('textarea', 'note')
    note.placeholder = '例如：这跟上次那篇讲场域的文章是一回事，回头一起看'
    note.value = it.note || ''
    note.addEventListener('click', (e) => e.stopPropagation())
    note.addEventListener('blur', async () => {
      if (note.value === (it.note || '')) return
      await window.todoApi.update(it.id, { note: note.value })
      it.note = note.value
      toast('备注已保存')
    })
    nf.appendChild(note)
    more.appendChild(nf)

    const acts = el('div', 'acts')

    const sel = el('select', 'listSel')
    for (const l of lists || []) {
      const o = el('option', '', l.name)
      o.value = l.id
      if (l.id === it.listId) o.selected = true
      sel.appendChild(o)
    }
    sel.title = '归到哪个主题'
    sel.addEventListener('click', (e) => e.stopPropagation())
    sel.addEventListener('change', async () => {
      await window.todoApi.update(it.id, { listId: sel.value })
      render()
    })
    acts.appendChild(sel)

    const ask = el('button', 'act pri', '追问')
    ask.title = '带着这段原文打开对话，继续问下去'
    ask.addEventListener('click', (e) => {
      e.stopPropagation()
      window.todoApi.openChat(it.text)
    })
    acts.appendChild(ask)

    const recapBtn = el('button', 'act', '回顾一下')
    recapBtn.dataset.recap = it.id
    recapBtn.title = '让 AI 说清这段在讲什么、值得往哪儿深挖（会消耗一次额度）'
    recapBtn.addEventListener('click', (e) => {
      e.stopPropagation()
      recaps.set(it.id, { text: '', streaming: true, error: '' })
      paintRecap(it.id)
      recapBtn.disabled = true
      window.todoApi.recap(it.id)
    })
    if (recaps.get(it.id) && recaps.get(it.id).streaming) recapBtn.disabled = true
    acts.appendChild(recapBtn)

    const arch = el('button', 'act quiet', it.state === 'archived' ? '取消归档' : '归档')
    arch.addEventListener('click', async (e) => {
      e.stopPropagation()
      await window.todoApi.update(it.id, { state: it.state === 'archived' ? 'open' : 'archived' })
      render()
    })
    acts.appendChild(arch)

    const del = el('button', 'act quiet del', '删除')
    del.addEventListener('click', async (e) => {
      e.stopPropagation()
      if (!confirm('删除这条待办？')) return
      await window.todoApi.remove(it.id)
      render()
    })
    acts.appendChild(del)

    more.appendChild(acts)

    const recap = el('div', 'recap')
    recap.dataset.id = it.id
    const st = recaps.get(it.id)
    if (st && (st.text || st.error)) {
      recap.className = 'recap show' + (st.error ? ' err' : '')
      recap.textContent = st.error || st.text
      if (st.streaming) recap.appendChild(el('span', 'caret'))
    }
    more.appendChild(recap)

    box.appendChild(more)

    // 展开区里的点击不该触发折叠
    more.addEventListener('click', (e) => e.stopPropagation())
    box.addEventListener('click', () => {
      if (expanded.has(it.id)) expanded.delete(it.id)
      else expanded.add(it.id)
      render()
    })
    return box
  }

  // chrome.exe → Chrome
  function prettyApp(p) {
    const s = String(p || '').replace(/\.exe$/i, '').toLowerCase()
    const map = {
      chrome: 'Chrome', msedge: 'Edge', firefox: 'Firefox', opera: 'Opera',
      safari: 'Safari', '360se': '360 浏览器', qqbrowser: 'QQ 浏览器',
      winword: 'Word', excel: 'Excel', powerpnt: 'PowerPoint',
      notepad: '记事本', acrobat: 'Acrobat', acrord32: 'Acrobat',
      wechat: '微信', dingtalk: '钉钉', slack: 'Slack', code: 'VS Code',
      obsidian: 'Obsidian', onenote: 'OneNote', typora: 'Typora',
      wxwork: '企业微信', telegram: 'Telegram', discord: 'Discord'
    }
    return map[s] || (s ? s.charAt(0).toUpperCase() + s.slice(1) : '')
  }

  // ---------- 筛选 / 搜索 ----------
  document.querySelectorAll('.tab').forEach((b) => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((x) => x.classList.remove('on'))
      b.classList.add('on')
      filter = b.dataset.f
      render()
    })
  })

  let searchTimer = null
  $('search').addEventListener('input', () => {
    clearTimeout(searchTimer)
    searchTimer = setTimeout(() => {
      query = $('search').value.trim()
      render()
    }, 160)
  })

  // ---------- 新主题 ----------
  $('newListBtn').addEventListener('click', () => {
    const box = $('newListBox')
    const on = box.style.display === 'flex'
    box.style.display = on ? 'none' : 'flex'
    if (!on) $('newListName').focus()
  })
  async function createList() {
    const name = $('newListName').value.trim()
    if (!name) return
    await window.todoApi.addList(name)
    $('newListName').value = ''
    $('newListBox').style.display = 'none'
    toast('已创建主题「' + name + '」')
    render()
  }
  $('newListOk').addEventListener('click', createList)
  $('newListName').addEventListener('keydown', (e) => { if (e.key === 'Enter') createList() })

  // ---------- 导出 / 清理 ----------
  $('exportBtn').addEventListener('click', async () => {
    const r = await window.todoApi.exportMd()
    if (r.ok) toast('已导出到 ' + r.path)
    else if (r.error) toast('导出失败：' + r.error)
  })

  $('purgeBtn').addEventListener('click', async () => {
    const n = (lastData.stats && lastData.stats.archived) || 0
    if (!n) return toast('没有已归档的条目')
    if (!confirm('清掉 ' + n + ' 条已归档？已完成的会保留。')) return
    const r = await window.todoApi.purgeArchived()
    toast('已清理 ' + (r.removed || 0) + ' 条')
    render()
  })

  // ---------- 回顾的流式输出 ----------
  function paintRecap(id, streaming) {
    const box = document.querySelector('.recap[data-id="' + id + '"]')
    const st = recaps.get(id) || { text: '', error: '' }
    if (box) {
      box.className = 'recap show' + (st.error ? ' err' : '')
      box.textContent = st.error || st.text
      if (streaming) {
        box.appendChild(el('span', 'caret'))
        box.scrollTop = box.scrollHeight
      }
    }
    if (!streaming) {
      const btn = document.querySelector('.act[data-recap="' + id + '"]')
      if (btn) btn.disabled = false
    }
  }

  window.todoApi.onRecapDelta((d) => {
    const st = recaps.get(d.id) || { text: '', streaming: true, error: '' }
    st.text += d.chunk
    st.streaming = true
    recaps.set(d.id, st)
    paintRecap(d.id, true)
  })

  window.todoApi.onRecapDone((d) => {
    const st = recaps.get(d.id) || { text: '', error: '' }
    if (d.text) st.text = d.text
    if (!st.text) st.text = '（模型没有返回内容，等一下再试）'
    st.streaming = false
    st.error = ''
    recaps.set(d.id, st)
    paintRecap(d.id, false)
  })

  window.todoApi.onRecapError((d) => {
    const hint = /auth_required|quota|plan_required/.test(d.code || '') ? '（去设置里登录或升级后再试）' : ''
    recaps.set(d.id, { text: '', streaming: false, error: '回顾失败：' + (d.message || '未知错误') + hint })
    paintRecap(d.id, false)
  })

  window.todoApi.onTheme((t) => { document.documentElement.dataset.theme = t })
  window.todoApi.onChanged(() => render())

  render()
</script>
</body>
</html>
